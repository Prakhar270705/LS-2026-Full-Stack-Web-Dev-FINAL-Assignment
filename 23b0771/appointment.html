<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Appointment - CityCare Hospital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="logo">CityCare Hospital</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="doctors.html">Doctors</a></li>
    <li><a href="appointment.html">Appointment</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<section class="section">
  <h2>Book an Appointment</h2>
  <form id="appointmentForm">
    <label for="pname">Full Name</label>
    <input type="text" id="pname" required>

    <label for="pemail">Email</label>
    <input type="email" id="pemail" required>

    <label for="pphone">Phone</label>
    <input type="tel" id="pphone" required>

    <label for="dept">Department</label>
    <select id="dept">
      <option>Cardiology</option>
      <option>Neurology</option>
      <option>Pediatrics</option>
      <option>Orthopedics</option>
      <option>General</option>
    </select>

    <label for="pdate">Preferred Date</label>
    <input type="date" id="pdate" required>

    <label for="pmsg">Message (optional)</label>
    <textarea id="pmsg" rows="4"></textarea>

    <button type="submit" class="btn">Confirm Appointment</button>
    <p id="formMsg"></p>
  </form>
</section>

<footer>
  <p>CityCare Hospital, MG Road, Gorakhpur, UP</p>
  <p><a href="https://github.com/Prakhar270705/LS-2026-Full-Stack-Web-Dev-FINAL-Assignment" style="color:#9fd8e8;">GitHub Repo - Roll No 23b0771</a></p>
</footer>

<script>
document.getElementById('appointmentForm').addEventListener('submit', function(e){
  e.preventDefault();
  const data = {
    name: document.getElementById('pname').value,
    email: document.getElementById('pemail').value,
    phone: document.getElementById('pphone').value,
    dept: document.getElementById('dept').value,
    date: document.getElementById('pdate').value,
    msg: document.getElementById('pmsg').value
  };

  fetch('/api/book', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(res => {
    document.getElementById('formMsg').innerText = "Appointment booked! We will contact you shortly.";
    document.getElementById('appointmentForm').reset();
  })
  .catch(err => {
    document.getElementById('formMsg').innerText = "Something went wrong. Try again.";
  });
});
</script>

</body>
</html>
