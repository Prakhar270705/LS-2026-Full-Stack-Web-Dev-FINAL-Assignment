<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact - CityCare Hospital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="logo">CityCare Hospital</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="doctors.html">Doctors</a></li>
    <li><a href="appointment.html">Appointment</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<section class="section">
  <h2>Contact Us</h2>
  <div class="contact-info">
    <p>MG Road, Gorakhpur, Uttar Pradesh, India</p>
    <p>Phone: +91 98765 43210</p>
    <p>Email: contact@citycare.com</p>
  </div>

  <form id="contactForm">
    <label for="cname">Name</label>
    <input type="text" id="cname" required>

    <label for="cemail">Email</label>
    <input type="email" id="cemail" required>

    <label for="cmsg">Message</label>
    <textarea id="cmsg" rows="5" required></textarea>

    <button type="submit" class="btn">Send Message</button>
    <p id="formMsg2"></p>
  </form>
</section>

<footer>
  <p>CityCare Hospital, MG Road, Gorakhpur, UP</p>
</footer>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  const data = {
    name: document.getElementById('cname').value,
    email: document.getElementById('cemail').value,
    msg: document.getElementById('cmsg').value
  };

  fetch('/api/contact', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(res => {
    document.getElementById('formMsg2').innerText = "Message sent, thank you!";
    document.getElementById('contactForm').reset();
  })
  .catch(err => {
    document.getElementById('formMsg2').innerText = "Something went wrong. Try again.";
  });
});
</script>

</body>
</html>
